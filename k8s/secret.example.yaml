# Copiar como secret.yaml (esta en .gitignore) y cambiar la clave en las dos lineas
apiVersion: v1
kind: Secret
metadata:
  name: db-reportes-credenciales
  namespace: voltrix-reportes
type: Opaque
stringData:
  DB_USER: reportes
  DB_PASSWORD: cambiar-esta-clave
  DATABASE_URL: postgresql+psycopg://reportes:cambiar-esta-clave@db-reportes:5432/reportes
