# Floci: AWS local para el cluster EKS del Equipo 4
name: voltrix-floci

services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      # Socket de Docker: Floci crea el nodo k3s con el Docker del equipo
      - /var/run/docker.sock:/var/run/docker.sock
      # Estado local del emulador (no se sube)
      - ./data:/app/data
    environment:
      # Guardar el estado en ./data para que el cluster sobreviva a reinicios
      FLOCI_STORAGE_MODE: hybrid
      # Memoria maxima del nodo k3s (MiB)
      FLOCI_SERVICES_EKS_MAX_MEMORY_MIB: "3072"
      # Rango de puertos del API server de k3s
      FLOCI_SERVICES_EKS_API_SERVER_BASE_PORT: "6500"
      FLOCI_SERVICES_EKS_API_SERVER_MAX_PORT: "6599"
