# =============================================================================
# Contrato OpenAPI · Voltrix Energy · Equipo 4 · Reportes de Generación
# Basado en la plantilla común mantenida por el Equipo 1 (openapi-plantilla.yaml).
# Las secciones marcadas COMÚN se conservan sin cambios.
# Se sirve en GET /openapi.yaml y su URL se registra en la hoja Coordinacion_Voltrix.
# =============================================================================
openapi: 3.0.3
info:
  title: Voltrix Energy · Reportes de Generación
  version: 1.0.0
  description: |
    Contrato HTTP del servicio **Reportes de Generación** (Equipo 4). Calcula y expone los
    agregados de energía generada por planta, por activo y por periodo (hora, día o mes).

    **Servicios que consume:** Inventario de Activos (Equipo 1) y Telemetría de Plantas (Equipo 2).

    **Consumidores previstos**

    | Equipo | Servicio | Operaciones que usa |
    |---|---|---|
    | 5 | Pronóstico de Generación | `GET /reportes/generacion` (histórico diario por planta) |
    | 6 | Mantenimiento Predictivo | `GET /reportes/generacion` (agregados por activo) |
    | 7 | Facturación y Liquidación | `GET /reportes/generacion` (energía mensual por planta) |

    **Convenciones comunes a todos los equipos**

    - Fechas en RFC 3339 **con zona horaria** (`2026-11-19T14:00:00Z`).
    - Identificadores de plantas y activos según Inventario (Equipo 1): `PL-001`, `PL-001-PS-07`.
    - Cada consumidor envía `X-Equipo-Consumidor: equipo-<N>`; toda respuesta incluye `X-Request-Id`.
      Ambos se escriben en los logs como evidencia de consumo real.
    - Errores con el esquema común `Error` (`codigo`, `mensaje`, `requestId`, `detalles`).
    - `429` con `Retry-After` ante sobrecarga, `503` si la base de datos no responde y `502` si un
      servicio de otro equipo del que se depende falla.
    - `GET /health` y `GET /openapi.yaml` existen en todos los servicios.
    - Las operaciones de procesamiento intensivo aceptan `modo` (`secuencial` | `paralelo`) y
      `workers`, y devuelven `MetricasProcesamiento` para comparar ambas versiones.
  contact:
    name: Equipo 4 · Reportes de Generación
servers:                                                  # COMÚN
  - url: http://{host}:{puerto}
    description: Despliegue del Componente B (EC2) o entorno local. La dirección vigente está en la hoja Coordinacion_Voltrix.
    variables:
      host:
        default: localhost
        description: IP pública o DNS de la instancia EC2.
      puerto:
        default: "8080"
tags:
  - name: Reportes
    description: Consulta de los agregados de energía generada por planta, activo y periodo.
  - name: Procesamiento
    description: Operación intensiva con la técnica de paralelismo o concurrencia exigida al equipo.
  - name: Operación
    description: Salud del servicio y publicación del contrato.

paths:
  /reportes/generacion:
    get:
      tags: [Reportes]
      operationId: consultarReportesGeneracion
      summary: Consultar agregados de energía por planta, activo o periodo
      description: |
        Devuelve los agregados ya calculados y almacenados por `POST /reportes/generar`.
        Si no existen agregados para el filtro se devuelve una página vacía con `200`.
        Sin `activoId` se devuelven los agregados por planta; con `activoId`, los del activo.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
        - name: plantaId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identificador'
        - name: activoId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identificador'
        - name: desde
          in: query
          required: false
          description: Inicio del rango (inclusivo), RFC 3339 con zona horaria.
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          description: Fin del rango (exclusivo), RFC 3339 con zona horaria.
          schema:
            type: string
            format: date-time
        - name: granularidad
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Granularidad'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de agregados (puede estar vacía).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAgregados'
              examples:
                diarioPorPlanta:
                  $ref: '#/components/examples/PaginaAgregadosEjemplo'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /reportes/generar:
    post:
      tags: [Procesamiento]
      operationId: generarReportes
      summary: Calcular los agregados de generación (Map-Reduce simplificado)
      description: |
        Obtiene las lecturas de potencia desde Telemetría de Plantas (Equipo 2) y la capacidad
        nominal y el tipo de cada activo desde Inventario de Activos (Equipo 1). Con
        `modo=paralelo` aplica descomposición de tareas (Map-Reduce simplificado): la fase Map
        particiona las lecturas por (activo, periodo) y las procesa en un pool de `workers`
        procesos, integrando la potencia en el tiempo; la fase Reduce fusiona los resultados
        parciales por (planta o activo, periodo) y calcula el factor de planta. Con
        `modo=secuencial` se ejecuta la línea base con la misma función de cálculo en un solo
        proceso. Los agregados se guardan (reemplazando los del mismo periodo) y quedan
        disponibles en `GET /reportes/generacion`.

        Para respetar el límite de memoria de la instancia, el rango `desde`-`hasta` admite como
        máximo 31 días por solicitud y el servicio ejecuta un solo cálculo a la vez; si llega
        otro mientras tanto se responde `429` con `Retry-After`.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
        - $ref: '#/components/parameters/Modo'
        - $ref: '#/components/parameters/Workers'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudGeneracion'
            example:
              plantaIds: [PL-001, PL-002]
              desde: '2026-11-01T00:00:00-05:00'
              hasta: '2026-11-08T00:00:00-05:00'
              granularidad: dia
              nivel: planta
      responses:
        '200':
          description: Procesamiento completado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoGeneracion'
              example:
                generados: 14
                metricas:
                  modo: paralelo
                  workers: 2
                  elementos: 13440
                  duracionMs: 842
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '502':
          $ref: '#/components/responses/DependenciaFallida'
        '503':
          $ref: '#/components/responses/NoDisponible'

  # --------------------------- COMÚN: no modificar ---------------------------
  /health:
    get:
      tags: [Operación]
      operationId: consultarSalud
      summary: Comprobar la disponibilidad del servicio y de su base de datos
      description: No exige `X-Equipo-Consumidor`. Debe responder rápido y sin llamar a otros equipos de forma bloqueante.
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: disponible
                baseDatos: ok
                version: 1.0.0
                tiempoActivoSeg: 3600
        '503':
          description: El servicio no puede acceder a su base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: no_disponible
                baseDatos: error
                version: 1.0.0
                tiempoActivoSeg: 3600

  /openapi.yaml:
    get:
      tags: [Operación]
      operationId: obtenerContrato
      summary: Descargar este contrato
      description: URL que se registra en la columna "URL del contrato OpenAPI" de la hoja Coordinacion_Voltrix.
      responses:
        '200':
          description: Contrato en formato YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    # COMÚN
    EquipoConsumidor:
      name: X-Equipo-Consumidor
      in: header
      required: false
      description: Equipo que hace la llamada. Se registra en los logs como evidencia de consumo entre células.
      schema:
        type: string
        pattern: '^equipo-[1-7]$'
        example: equipo-2
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Número de elementos a omitir.
      schema:
        type: integer
        minimum: 0
        default: 0
    Modo:
      name: modo
      in: query
      required: false
      description: Versión del procesamiento a ejecutar (línea base o técnica paralela/concurrente).
      schema:
        type: string
        enum: [secuencial, paralelo]
        default: paralelo
    Workers:
      name: workers
      in: query
      required: false
      description: Número de hilos, goroutines, procesos o workers a usar en modo paralelo. Por defecto lo decide el servicio.
      schema:
        type: integer
        minimum: 1
        maximum: 64

  headers:
    # COMÚN
    X-Request-Id:
      description: Identificador de la petición, presente también en los logs del servicio.
      schema:
        type: string
        format: uuid
    Retry-After:
      description: Segundos que el consumidor debe esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:
    # COMÚN
    SolicitudInvalida:
      description: La solicitud no cumple el contrato.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: La solicitud no cumple el contrato.
            requestId: 0a4e9c1d-3f2b-4e8a-b7c6-5d1e2f3a4b5c
            detalles:
              - campo: desde
                problema: debe ser una fecha RFC 3339 con zona horaria
    NoEncontrado:
      description: El recurso no existe.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso REC-999 no existe.
            requestId: 9c2f7e4a-1d3b-4a6c-8e5f-0b7d9a1c3e2f
    Conflicto:
      description: Ya existe un recurso con ese identificador o el estado actual impide la operación.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DUPLICADO
            mensaje: Ya existe un recurso con el identificador REC-001.
            requestId: 4d8b2a6e-7c1f-4e3a-9b5d-2f6a8c0e1b4d
    Sobrecarga:
      description: Capacidad de admisión agotada. Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOBRECARGA
            mensaje: El servicio está atendiendo el máximo de peticiones simultáneas.
            requestId: 2e7a4c9b-6d1f-4b8e-a3c5-7f0d2b9e4a1c
    NoDisponible:
      description: Base de datos o servicio no disponible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_DISPONIBLE
            mensaje: No hay conexión con la base de datos.
            requestId: 8f1b3d5a-2c7e-4f9a-b6d0-1e4c7a9b2d5f
    DependenciaFallida:
      description: Un servicio de otro equipo del que se depende no respondió o respondió con error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DEPENDENCIA_FALLIDA
            mensaje: Telemetría de Plantas respondió 503.
            requestId: 3c6e9f2a-8b1d-4e7c-a5f0-6d2b9e1c4a7f
            detalles:
              - campo: equipo-2
                problema: GET /telemetria/PL-001 respondió 503

  examples:
    PaginaAgregadosEjemplo:
      summary: Energía diaria de una planta
      value:
        datos:
          - plantaId: PL-001
            activoId: null
            tipoActivo: null
            granularidad: dia
            periodoInicio: '2026-11-01T00:00:00-05:00'
            periodoFin: '2026-11-02T00:00:00-05:00'
            energiaKwh: 1843.52
            potenciaPromedioKw: 76.81
            potenciaMaximaKw: 212.4
            numeroLecturas: 960
            capacidadNominalKw: 250
            factorPlanta: 0.3072
            generadoEn: '2026-11-08T02:15:44Z'
          - plantaId: PL-001
            activoId: null
            tipoActivo: null
            granularidad: dia
            periodoInicio: '2026-11-02T00:00:00-05:00'
            periodoFin: '2026-11-03T00:00:00-05:00'
            energiaKwh: 1702.09
            potenciaPromedioKw: 70.92
            potenciaMaximaKw: 198.7
            numeroLecturas: 960
            capacidadNominalKw: 250
            factorPlanta: 0.2837
            generadoEn: '2026-11-08T02:15:44Z'
        total: 2
        limit: 50
        offset: 0

  schemas:
    # ------------------------------- COMÚN -------------------------------
    Identificador:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      example: PL-001-PS-07
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, requestId]
      properties:
        codigo:
          type: string
          pattern: '^[A-Z_]+$'
          description: |
            Código estable en MAYÚSCULAS. Comunes: SOLICITUD_INVALIDA, NO_ENCONTRADO, DUPLICADO,
            SOBRECARGA, NO_DISPONIBLE, DEPENDENCIA_FALLIDA, ERROR_INTERNO. Cada equipo puede
            agregar los suyos y documentarlos aquí.
            Propio del Equipo 4: RANGO_EXCEDIDO (el rango desde-hasta supera 31 días; se
            devuelve con código HTTP 400).
          example: NO_ENCONTRADO
        mensaje:
          type: string
        requestId:
          type: string
        detalles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [campo, problema]
            properties:
              campo:
                type: string
              problema:
                type: string
    Salud:
      type: object
      additionalProperties: false
      required: [estado, baseDatos]
      properties:
        estado:
          type: string
          enum: [disponible, no_disponible]
        baseDatos:
          type: string
          enum: [ok, error]
        version:
          type: string
        tiempoActivoSeg:
          type: integer
          minimum: 0
    MetricasProcesamiento:
      type: object
      additionalProperties: false
      required: [modo, workers, elementos, duracionMs]
      description: Evidencia de cada ejecución intensiva, útil para el benchmark secuencial contra paralelo.
      properties:
        modo:
          type: string
          enum: [secuencial, paralelo]
        workers:
          type: integer
          minimum: 1
        elementos:
          type: integer
          minimum: 0
          description: Cantidad de elementos procesados (lecturas, activos, plantas, liquidaciones...).
        duracionMs:
          type: integer
          minimum: 0

    # ------------------------- Propios del Equipo 4 -------------------------
    Granularidad:
      type: string
      enum: [hora, dia, mes]
      default: dia
    AgregadoGeneracion:
      type: object
      additionalProperties: false
      required: [plantaId, granularidad, periodoInicio, periodoFin, energiaKwh, numeroLecturas, generadoEn]
      properties:
        plantaId:
          $ref: '#/components/schemas/Identificador'
        activoId:
          allOf:
            - $ref: '#/components/schemas/Identificador'
          nullable: true
          description: Nulo cuando el agregado es de toda la planta.
        tipoActivo:
          type: string
          nullable: true
          description: Tipo de activo según Inventario (panel solar, turbina eólica o batería).
        granularidad:
          $ref: '#/components/schemas/Granularidad'
        periodoInicio:
          type: string
          format: date-time
        periodoFin:
          type: string
          format: date-time
        energiaKwh:
          type: number
          minimum: 0
          description: Energía generada en el periodo (integración de la potencia en el tiempo).
        potenciaPromedioKw:
          type: number
        potenciaMaximaKw:
          type: number
        numeroLecturas:
          type: integer
          minimum: 0
        capacidadNominalKw:
          type: number
          nullable: true
          description: Tomada de Inventario de Activos.
        factorPlanta:
          type: number
          nullable: true
          description: energiaKwh / (capacidadNominalKw × horas del periodo).
        generadoEn:
          type: string
          format: date-time
    PaginaAgregados:
      type: object
      additionalProperties: false
      required: [datos, total, limit, offset]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/AgregadoGeneracion'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    SolicitudGeneracion:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        plantaIds:
          type: array
          description: Si se omite, se procesan todas las plantas.
          items:
            $ref: '#/components/schemas/Identificador'
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
          description: Debe ser posterior a `desde`; el rango admite como máximo 31 días.
        granularidad:
          $ref: '#/components/schemas/Granularidad'
        nivel:
          type: string
          enum: [planta, activo]
          default: planta
          description: planta agrega todos los activos de la planta; activo genera un agregado por activo.
    ResultadoGeneracion:
      type: object
      additionalProperties: false
      required: [generados, metricas]
      properties:
        generados:
          type: integer
          minimum: 0
          description: Cantidad de agregados calculados y guardados.
        metricas:
          $ref: '#/components/schemas/MetricasProcesamiento'
